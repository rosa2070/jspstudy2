<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>test16_slide.html</title>
<style>
	* {margin:0px; padding:0px;}
	#parent{width:700px; height:200px; background-color:orange;
		position:relative; left:200px; top:30px; overflow:hidden;}
	#child{width:980px; height:200px; position:absolute; left:0px;}
	#child ul li img{width:136px; height:196px; margin:2px;}
	#child ul li{float:left; list-style:none;}	
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
	$(document).ready(function() {
		setInterval(function() {
			// $("#child").css("left", -140);
			let moveLeft = parseInt($("#child").css("left"))-140;
			$("#child").animate({
				left:moveLeft
			}, 500, function() {
				// 이미지가 모두 이동하면 처음부터 다시 오른쪽에서 등장하도록 해보세요.
				if(moveLeft<=-980) {
					$(this).css("left", 700);
				}
				 
			});
		}, 2000);
	});
</script>
</head>
<body>
	<div id="parent">
		<div id="child">
			<ul>
				<li><img src="images/001.jpg"></li>
				<li><img src="images/002.jpg"></li>
				<li><img src="images/003.jpg"></li>
				<li><img src="images/004.jpg"></li>
				<li><img src="images/005.jpg"></li>
				<li><img src="images/006.jpg"></li>
				<li><img src="images/007.jpg"></li>
			</ul>
		</div>
	</div>
</body>
</html>
