<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>test18_form.html</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
$(function() {
	$(".required").focusin(function() {
		$(this).next().text("필수입력사항입니다.");
	});
	$(".required").focusout(function() {
		$(this).next().text("");
	});
	$("form").submit(function() {
		const id = $("input[name='id']").val();
		if (id=="") {
			$("input[name='id']").focus();
			$("input[name='id']").next().text("아이디를 입력하세요");
			return false; // submit취소
		}
		//비밀번호와 비밀번호 확인이 일치하는지 검사해 보세요.
		if($("input[name='pwd']").val()!=$("input[name='pwd1']").val()) {
			$("input[name='pwd1']").next().text("비밀번호가 일치하지 않아요.");
			return false;
		}
		return true;
	});
});
</script>


</head>
<body>
	<h1>회원가입</h1>
	<form action="join.jsp">
		아이디(*) <input type="text" name="id" class="required"><span></span><br>
		비밀번호(*) <input type="password" name="pwd" class="required"><span></span><br>
		비밀번호확인(*) <input type="password" name="pwd1" class="required"><span></span><br>
		이메일(*) <input type="text" name="email"><br>
		<input type="submit" value="가입">
	</form>
</body>
</html>
