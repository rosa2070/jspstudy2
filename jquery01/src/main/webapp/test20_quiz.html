<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
	$(function() {
		$("form").submit(function(e) {
			if ($("input[name='id']").val().length > 8 || $("input[name='id']").val().length < 5 ) {
				$("input[name='id']").focus();
				alert("아이디를 5자~8자 사이로 입력하세요");

				return false;
			}
			
			if ($("input[name='pwd1']").val() != $("input[name='pwd2']").val()) {
				$("input[name='pwd2']").focus();
				alert("비밀번호가 일치하지 않습니다.");
				return false;
			}
			
			let cnt = $("input:checked").length;
/* 			$("input:checked").each(function() {
				console.log($(this).val());
			}); */
			/* $("input[name='hobby']").each(function() {
				if($(this).prop("checked")) { //checked가 true일때
					cnt++;
				}
			}); */
			if (cnt == 0) {
				alert("취미는 하나이상 선택되어야 해요..");
				return false;
			}
		});
	});

</script>
</head>
<body>
	<!-- 
	아이디가 5~8자 사이인지 검사하세요.
	취미는 하나이상 선택되어야 서버로 전송되도록 해보세요.
	비밀번호가 일치하는지 검사하세요.
	 -->
	<form action="join.jsp">
		아이디(5~8자 사이) <input type="text" name="id"><br>
		비밀번호 <input type="password" name="pwd1"><br>
		비밀번호확인 <input type="password" name="pwd2"><br>
		취미<br>
		<input type="checkbox" value="여행" name="hobby" checked="checked">여행
		<input type="checkbox" value="영화" name="hobby">영화
		<input type="checkbox" value="게임" name="hobby">게임
		<br>
		<input type="submit" value="가입">
	</form>
</body>
</html>
